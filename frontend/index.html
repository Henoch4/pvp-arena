<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PvP Arena</title><meta name="description" content="PvP match staking where the winner takes 2x.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Sora:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);overflow-x:hidden}
a{color:inherit}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.rv{opacity:0;transform:translateY(46px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
#toasts{position:fixed;right:16px;bottom:16px;z-index:999;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 32px)}
.toast{background:var(--fg);color:var(--bg);padding:12px 16px;font-size:14px;animation:tin .35s ease both;border-left:6px solid var(--ac)}
.toast.err{border-left-color:#f33}.toast.ok{border-left-color:#2c6}
@keyframes tin{from{opacity:0;transform:translateX(40px)}}
footer{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;padding:28px 16px;font-size:13px;position:relative;z-index:2}
footer a{text-decoration:underline}
@media(prefers-reduced-motion:reduce){.rv{transition:none;opacity:1;transform:none}*{animation:none!important}}

:root{--motion-fast:200ms;--motion-base:600ms;--motion-slow:1100ms;--bg:#a9d8f5;--fg:#0b1b2b;--ac:#ff4a1c;--mut:#3e6585}
body{font-family:'Sora',sans-serif;cursor:crosshair}
.bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:8px;flex-wrap:wrap}
.brand{font:400 26px 'Bowlby One';letter-spacing:.06em;text-decoration:none;color:#fff;mix-blend-mode:difference}
.barr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--bg);padding:6px 8px;border:2px solid var(--fg)}
.badge{background:var(--fg);color:var(--bg);padding:5px 9px;font-weight:800;text-transform:uppercase;font-size:12px}
select{background:transparent;border:2px solid var(--fg);padding:5px;font:inherit;font-weight:700}
.wallet-btn,.go{background:var(--ac);color:#fff;border:0;padding:11px 18px;font:400 18px 'Bowlby One';letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%);cursor:pointer;transition:transform .15s}
.wallet-btn:hover,.go:hover{transform:translateX(6px)}
.arena{min-height:100vh;display:grid;grid-auto-flow:dense;position:relative;overflow:hidden;background:var(--fg)}
.half{position:absolute;inset:0}
.half.a{background:var(--bg);clip-path:polygon(0 0,62% 0,38% 100%,0 100%)}
.half.b{background:var(--ac);clip-path:polygon(62% 0,100% 0,100% 100%,38% 100%);animation:wipe 1.2s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:polygon(62% 0,62% 0,38% 100%,38% 100%)}}
.hero-t{position:relative;z-index:2;align-self:center;padding:110px 16px 40px}
.hero-t h1{font:400 clamp(90px,25vw,420px)/.82 'Bowlby One';text-transform:uppercase;letter-spacing:-.01em}
.hero-t h1 .l{display:block}.hero-t h1 .r{display:block;text-align:right;color:#fff;-webkit-text-stroke:2px var(--fg)}
.vs{position:absolute;z-index:3;left:50%;top:50%;transform:translate(-50%,-50%);font:400 clamp(60px,12vw,180px) 'Bowlby One';background:var(--fg);color:var(--ac);padding:0 20px;animation:shake 3s infinite}
@keyframes shake{0%,90%,100%{transform:translate(-50%,-50%)}92%{transform:translate(-52%,-49%) skew(-4deg)}95%{transform:translate(-48%,-51%) skew(4deg)}}
.launch{position:absolute;z-index:4;left:16px;bottom:20px;background:var(--fg);color:#fff;padding:10px 14px;font:800 13px 'Sora';text-transform:uppercase;letter-spacing:.14em;max-width:calc(100% - 32px)}
.pot{position:absolute;z-index:4;right:16px;bottom:20px;color:#fff;text-align:right;font:400 clamp(20px,4vw,48px)/1 'Bowlby One'}.pot small{display:block;font:700 11px 'Sora';letter-spacing:.2em}
.strip{background:var(--fg);color:var(--ac);overflow:hidden;white-space:nowrap;font:400 40px 'Bowlby One';padding:8px 0}
.strip div{display:inline-block;animation:mq 20s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.ring{padding:70px 16px;display:grid;grid-template-columns:1fr 1.2fr;gap:30px;align-items:start}
.how{font:400 clamp(40px,7vw,100px)/.9 'Bowlby One';text-transform:uppercase}.how em{color:var(--ac);font-style:normal}
.how p{font:400 16px/1.5 'Sora';text-transform:none;margin-top:20px;color:var(--mut);max-width:34ch}
.cards{display:grid;gap:22px}
.cards form{background:#fff;border:3px solid var(--fg);padding:22px;box-shadow:12px 12px 0 var(--fg);display:grid;gap:10px}
.cards form:nth-child(2){margin-left:6vw;box-shadow:12px 12px 0 var(--ac)}
.cards h2{font:400 36px 'Bowlby One';text-transform:uppercase}
.cards label{font:700 11px 'Sora';letter-spacing:.16em;text-transform:uppercase}
.cards input{border:0;border-bottom:3px solid var(--fg);padding:8px 2px;font:inherit;background:transparent;outline:none}
.cards input:focus{border-color:var(--ac)}
.out{display:none;font:12px ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;background:#e6f3fc;padding:10px}.out.show{display:block}
.cards .go{justify-self:start}
.board{padding:0 16px 70px}.board h3{font:400 54px 'Bowlby One';text-transform:uppercase;margin-bottom:12px}
.m{display:grid;grid-template-columns:50px 1fr auto 1fr 90px;align-items:center;gap:10px;border-top:3px solid var(--fg);padding:14px 0;font-weight:700;transition:background .2s,padding .2s}
.m:hover{background:var(--ac);color:#fff;padding-inline:12px}
.m b{font:400 28px 'Bowlby One'}.m .vsm{color:var(--ac);font:400 20px 'Bowlby One'}.m:hover .vsm{color:#fff}
@media(max-width:800px){.ring{grid-template-columns:1fr}.cards form:nth-child(2){margin-left:0}.m{grid-template-columns:36px 1fr 24px 1fr}.m span:last-child{grid-column:2/-1}.half.a{clip-path:polygon(0 0,100% 0,100% 40%,0 60%)}.half.b{clip-path:polygon(0 60%,100% 40%,100% 100%,0 100%);animation:none}.hero-t{padding-top:100px}.launch{bottom:90px}}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc,currentColor);outline-offset:2px}</style><link href="./product.css" rel="stylesheet"><script defer src="./vendor/ethers.umd.min.js"></script><script defer src="./product.js"></script></head><body id="top" class="suite-product su-rail"><div class="suite-nav" role="navigation" aria-label="Main navigation"><a class="suite-brand" href="#top">PvP Arena</a><span id="suite-network" role="status">Checking mainnet…</span><button id="suite-wallet" type="button" disabled>Connect wallet</button><button id="suite-disconnect" type="button" hidden>Disconnect</button><a href="#suite-workspace">Open app</a></div>

<section id="suite-actions" aria-labelledby="suite-actions-heading"><h2 id="suite-actions-heading">Your next move</h2><p id="suite-actions-note"></p><div class="suite-grid" id="suite-action-grid"></div></section>
